name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the binaries to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            binary: target/release/habbo-launcher-rs
            asset: habbo-launcher-linux-x64
          - name: windows-x64
            os: windows-latest
            binary: target/release/habbo-launcher-rs.exe
            asset: habbo-launcher-windows-x64.exe
          - name: macos-arm64
            os: macos-latest
            binary: target/release/habbo-launcher-rs
            asset: habbo-launcher-macos-arm64
          - name: macos-x64
            os: macos-15-intel
            binary: target/release/habbo-launcher-rs
            asset: habbo-launcher-macos-x64

    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            libegl1-mesa-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: cargo build (release)
        run: cargo build --release

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      # Double-click install in Mint/Ubuntu: no chmod, no terminal, menu entry + habbo:// handler.
      - name: Build .deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          PKG="habbo-launcher_${VER}_amd64"
          ROOT="build/deb/$PKG"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/share/applications"
          install -m 0755 target/release/habbo-launcher-rs "$ROOT/usr/bin/habbo-launcher"
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Habbo Custom Launcher' \
            'Exec=/usr/bin/habbo-launcher %u' \
            'Terminal=false' \
            'MimeType=x-scheme-handler/habbo;' \
            'Categories=Game;' \
            'Comment=Launch the Habbo classic client (official AIR or AIR+)' \
            > "$ROOT/usr/share/applications/habbo-launcher.desktop"
          printf '%s\n' \
            '#!/bin/sh' \
            'set -e' \
            'command -v update-desktop-database >/dev/null && update-desktop-database -q /usr/share/applications || true' \
            'exit 0' > "$ROOT/DEBIAN/postinst"
          chmod 0755 "$ROOT/DEBIAN/postinst"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: habbo-launcher
          Version: ${VER}
          Architecture: amd64
          Maintainer: Zaakhir Anas <zaakhiranas@users.noreply.github.com>
          Installed-Size: $(du -sk "$ROOT/usr" | cut -f1)
          Depends: libc6 (>= 2.35), libx11-6, libxcursor1, libxi6, libxrandr2, libxkbcommon0, libgl1, libegl1, libwayland-client0
          Section: games
          Priority: optional
          Description: Habbo Custom Launcher
           Alternative launcher for the Habbo classic client. Starts the official
           AIR build or the AIR+ (HabboAirPlus) build, patches the client on
           download, and handles habbo:// "Launch and log in" links.
          EOF
          dpkg-deb --root-owner-group --build "$ROOT" "dist/${PKG}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Habbo Custom Launcher ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: artifacts/*
          body: |
            Single-file Rust launcher for the Habbo classic client.

            - **AIR** — official hotel client
            - **AIR+** — unofficial [HabboAirPlus](https://github.com/LilithRainbows/HabboAirPlus) SWF by **LilithRainbows** (credit theirs, not ours)

            No installer, no .NET, no admin rights. Drop the binary anywhere and run it.
            First launch downloads the client build and the platform patch zip into `%APPDATA%\Habbo Launcher\`.

            Windows: keep the exe at the path the `habbo://` registry entry points to, or website "Launch and log in" links will not open it.