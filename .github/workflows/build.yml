name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            artifact: habbo-launcher-rs
            binary: target/release/habbo-launcher-rs
          - name: windows-x64
            os: windows-latest
            artifact: habbo-launcher-rs.exe
            binary: target/release/habbo-launcher-rs.exe
          - name: macos-arm64
            os: macos-latest
            artifact: habbo-launcher-rs-macos-arm64
            binary: target/release/habbo-launcher-rs
          # Intel macOS runner. If this label is retired, swap it for macos-15-intel.
          - name: macos-x64
            os: macos-15-intel
            artifact: habbo-launcher-rs-macos-x64
            binary: target/release/habbo-launcher-rs

    steps:
      - uses: actions/checkout@v4

      # eframe/glow/winit need the X11 + Wayland + GL development headers to link on Linux.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            libegl1-mesa-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # fmt is advisory only; clippy gates hard so platform-specific cfg branches get checked.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --release

      - name: cargo build (release)
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
